apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-petclinic-gitops
  namespace: openshift-gitops 
spec:
  project: default
  source:
    repoURL: 'github.com/bizcochillo/spring-petclinic.git' 
    targetRevision: master
    path: gitops/manifests
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: demo-dockerfile
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
